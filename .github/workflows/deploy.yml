name: Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  deploy:
    name: ${{ github.ref == 'refs/heads/main' && 'Deploy (production)' || 'Deploy (preview)' }}
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'preview' }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull Vercel environment
        run: |
          ENV=${{ github.ref == 'refs/heads/main' && 'production' || 'preview' }}
          vercel pull --yes --environment=$ENV --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: apps/web

      - name: Build project
        run: |
          PROD=${{ github.ref == 'refs/heads/main' && '--prod' || '' }}
          vercel build $PROD --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: apps/web
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEXTJS_REVALIDATE_SECRET: ${{ secrets.NEXTJS_REVALIDATE_SECRET }}

      - name: Deploy to Vercel
        id: deploy
        run: |
          PROD=${{ github.ref == 'refs/heads/main' && '--prod' || '' }}
          URL=$(vercel deploy --prebuilt $PROD --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$URL" >> $GITHUB_OUTPUT

      - name: Comment preview URL on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `**Preview deploy:** ${{ steps.deploy.outputs.url }}`
            })
