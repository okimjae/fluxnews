name: Content Pipeline (every 6h)

on:
  schedule:
    - cron: '30 */6 * * *'  # a cada 6h — 00:30, 06:30, 12:30, 18:30 UTC
  workflow_dispatch:
    inputs:
      tenant:
        description: 'Tenant específico (vazio = todos)'
        required: false
        default: ''
      step:
        description: 'Passo único (vazio = todos)'
        required: false
        default: ''
        type: choice
        options:
          - ''
          - generate
          - seo
          - affiliate
          - telegram
          - radio
          - shorts
          - newsletter

jobs:
  pipeline:
    name: Generate + Publish
    runs-on: ubuntu-latest
    env:
      DATABASE_URL:         ${{ secrets.DATABASE_URL }}
      GEMINI_API_KEY:       ${{ secrets.GEMINI_API_KEY }}
      RESEND_API_KEY:       ${{ secrets.RESEND_API_KEY }}
      TELEGRAM_BOT_TOKEN_CRIPTO:      ${{ secrets.TELEGRAM_BOT_TOKEN_CRIPTO }}
      TELEGRAM_BOT_TOKEN_SAUDE:       ${{ secrets.TELEGRAM_BOT_TOKEN_SAUDE }}
      TELEGRAM_BOT_TOKEN_TECH:        ${{ secrets.TELEGRAM_BOT_TOKEN_TECH }}
      TELEGRAM_BOT_TOKEN_FINANCAS:    ${{ secrets.TELEGRAM_BOT_TOKEN_FINANCAS }}
      TELEGRAM_BOT_TOKEN_GAMES:       ${{ secrets.TELEGRAM_BOT_TOKEN_GAMES }}
      TELEGRAM_BOT_TOKEN_ESPORTES:    ${{ secrets.TELEGRAM_BOT_TOKEN_ESPORTES }}
      TELEGRAM_BOT_TOKEN_STREAMING:   ${{ secrets.TELEGRAM_BOT_TOKEN_STREAMING }}
      TELEGRAM_BOT_TOKEN_MOBILIDADE:  ${{ secrets.TELEGRAM_BOT_TOKEN_MOBILIDADE }}
      GOOGLE_CLOUD_TTS_KEY: ${{ secrets.GOOGLE_CLOUD_TTS_KEY }}
      R2_ACCESS_KEY_ID:     ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET:            ${{ secrets.R2_BUCKET }}
      R2_PUBLIC_URL:        ${{ secrets.R2_PUBLIC_URL }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install uv + deps
        run: |
          pip install uv
          uv pip install --system -r agents/pyproject.toml

      # Top 3 artigos mais recentes por tenant — curadoria por frescor + Gemini
      - name: 1 — AI Content Generator (top 3 por tenant)
        if: ${{ inputs.step == '' || inputs.step == 'generate' }}
        run: python agents/content_generator.py --limit=3 ${{ inputs.tenant && format('--tenant={0}', inputs.tenant) || '' }}

      - name: 2 — SEO Scorer
        if: ${{ inputs.step == '' || inputs.step == 'seo' }}
        run: python agents/seo_scorer.py ${{ inputs.tenant && format('--tenant={0}', inputs.tenant) || '' }}

      - name: 3 — Affiliate Injector
        if: ${{ inputs.step == '' || inputs.step == 'affiliate' }}
        run: python agents/affiliate_injector.py ${{ inputs.tenant && format('--tenant={0}', inputs.tenant) || '' }}

      - name: 4 — Telegram Publisher (1 por run)
        if: ${{ inputs.step == '' || inputs.step == 'telegram' }}
        run: python agents/telegram_publisher.py --limit=1 ${{ inputs.tenant && format('--tenant={0}', inputs.tenant) || '' }}

      - name: 5 — Radio Generator
        if: ${{ inputs.step == '' || inputs.step == 'radio' }}
        run: python agents/radio_generator.py ${{ inputs.tenant && format('--tenant={0}', inputs.tenant) || '' }}

      - name: 6 — Shorts Generator
        if: ${{ inputs.step == '' || inputs.step == 'shorts' }}
        run: python agents/shorts_generator.py ${{ inputs.tenant && format('--tenant={0}', inputs.tenant) || '' }}

      # Newsletter só às segundas / manual override
      - name: 7 — Newsletter (Segundas-feiras)
        if: ${{ inputs.step == '' || inputs.step == 'newsletter' }}
        run: |
          TENANT_FLAG="${{ inputs.tenant && format('--tenant={0}', inputs.tenant) || '' }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$(date +%u)" = "1" ]; then
            python agents/newsletter_sender.py $TENANT_FLAG
          else
            echo "Não é segunda — newsletter pulada. Use workflow_dispatch para forçar."
          fi

      # Purga o ISR cache do Vercel após publicação de novos artigos
      - name: 8 — Revalidate Vercel cache
        if: ${{ inputs.step == '' || inputs.step == 'generate' }}
        env:
          NEXTJS_REVALIDATE_SECRET: ${{ secrets.NEXTJS_REVALIDATE_SECRET }}
          VERCEL_DEPLOYMENT_URL: ${{ secrets.VERCEL_DEPLOYMENT_URL }}
        run: |
          if [ -n "$VERCEL_DEPLOYMENT_URL" ] && [ -n "$NEXTJS_REVALIDATE_SECRET" ]; then
            curl -s -X POST \
              -H "Content-Type: application/json" \
              -H "x-revalidate-secret: $NEXTJS_REVALIDATE_SECRET" \
              -d '{}' \
              "$VERCEL_DEPLOYMENT_URL/api/revalidate" \
              && echo "Cache revalidado com sucesso." \
              || echo "Revalidate falhou (não bloqueante)."
          else
            echo "VERCEL_DEPLOYMENT_URL ou NEXTJS_REVALIDATE_SECRET não configurado — pulando revalidate."
          fi
