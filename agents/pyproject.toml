[project]
name = "fluxnews-agents"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "feedparser>=6.0",
    "httpx>=0.28",
    "google-generativeai>=0.8",
    "groq>=0.13",
    "pydantic>=2.10",
    "psycopg[binary]>=3.2",
    "python-dotenv>=1.0",
    "resend>=2.0",
    "moviepy>=2.0",
]

[tool.uv]
dev-dependencies = [
    "ruff>=0.9",
    "mypy>=1.14",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.13"
strict = true
